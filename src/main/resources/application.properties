spring.application.name=gymPartner

spring.datasource.url=jdbc:mysql://localhost:3306/gym_partner_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.fail-on-empty-beans=false

jwt.secret=mySuperSecretKeyForGymPartnerApplicationThatIsAtLeast256BitsLong
#------24hours
jwt.expiration=86400000

file.upload-dir=uploads/profile-pictures

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
