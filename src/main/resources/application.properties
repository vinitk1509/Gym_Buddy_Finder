spring.application.name=gymPartner
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym_partner_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.serialization.fail-on-empty-beans=false

jwt.secret=${JWT_SECRET:devOnlyChangeThisSecretBeforeDeployingGymPartner123456}
#------24hours
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.reset-expiration=${JWT_RESET_EXPIRATION_MS:900000}

file.upload-dir=${UPLOAD_DIR:uploads/profile-pictures}
cloudinary.url=${CLOUDINARY_URL:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Google Gmail API OAuth2 configuration
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.refresh.token=${GOOGLE_REFRESH_TOKEN:}
app.mail.from=${SMTP_FROM:gymPartner13@gmail.com}
app.mail.from-name=${SMTP_FROM_NAME:GymPartner}
