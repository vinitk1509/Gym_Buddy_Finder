spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Use a test JWT secret so tests pass
jwt.secret=test_secret_for_tests_must_be_very_long_at_least_256_bits_long
jwt.expiration=86400000
jwt.reset-expiration=900000

# Other minimal props for test context
app.cors.allowed-origins=http://localhost:5173
app.websocket.allowed-origins=http://localhost:5173
file.upload-dir=target/test-uploads
